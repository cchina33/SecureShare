name = "secureshare"
compatibility_date = "2026-09-25"
pages_build_output_dir = "public"

# Cloudflare D1 データベースバインディング
[[d1_databases]]
binding = "DB"
database_name = "secureshare-db"
database_id = "b4f160f3-4fa2-4fbc-85bb-a4dc23d062b5"

# Cloudflare R2 バケットバインディング (画像保存用)
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "secureshare-images"

